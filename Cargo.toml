[package]
name = "helix"
version = "0.1.0"
edition = "2024"
description = "A framework for building pipelined services with sources, processors, and sinks"

[[bin]]
name = "helix"
path = "src/bin/runner.rs"

[dependencies]
async-nats = "0.38"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
jiff = { version = "0.2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"

[dev-dependencies]
tokio-test = "0.4"
